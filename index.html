<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="이름을 입력하고 나만의 환영 인사를 받아보세요." />
    <title>반가워요 — 당신을 위한 인사</title>
    <style>
      :root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #253a34; background: #f5f5ef; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
      header { padding: 30px 7%; font-size: 19px; font-weight: 800; letter-spacing: -.7px; }
      header span { color: #6c8b51; }
      main { flex: 1; display: grid; place-items: center; padding: 40px 24px 80px; }
      .card { width: 100%; max-width: 520px; text-align: center; }
      .symbol { width: 84px; height: 84px; margin: 0 auto 32px; border-radius: 28px; background: #e5ebd9; display: grid; place-items: center; font-size: 38px; transform: rotate(-7deg); }
      .eyebrow { color: #75816e; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
      h1 { margin: 17px 0; font-size: clamp(32px, 7vw, 44px); letter-spacing: -2px; line-height: 1.35; overflow-wrap: anywhere; }
      .description { color: #798078; font-size: 16px; line-height: 1.8; margin: 0 0 38px; }
      form { text-align: left; padding: 28px; background: #fff; border: 1px solid #e5e8de; border-radius: 20px; box-shadow: 0 12px 40px #263b3110; }
      label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
      input { width: 100%; padding: 16px; border: 1px solid #dce1d7; border-radius: 10px; font: inherit; color: inherit; background: #fafbf8; }
      input::placeholder { color: #a4aaa0; }
      input:focus-visible { outline: 3px solid #c8d9b2; outline-offset: 2px; }
      button { width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 10px; background: #354f3d; color: white; font: inherit; font-weight: 700; cursor: pointer; transition: background .2s; }
      button:hover { background: #46664c; }
      button:focus-visible { outline: 3px solid #91ae71; outline-offset: 3px; }
      .note { margin: 20px 0 0; color: #92978c; font-size: 12px; }
      footer { padding: 24px; text-align: center; color: #969c91; font-size: 12px; }
      @media (max-width: 420px) { form { padding: 22px; } header { padding: 24px; } }
    </style>
  </head>
  <body>
    <header>반가워요<span>.</span></header>
    <main>
      <section class="card" aria-label="환영 인사">
        <div class="symbol" aria-hidden="true">👋</div>
        <p class="eyebrow">A LITTLE HELLO FOR YOU</p>
        <h1 id="greeting" aria-live="polite">당신을 만나서<br />반가워요.</h1>
        <p class="description">작은 인사로 시작하는 좋은 하루.<br />어떤 이름으로 불러드릴까요?</p>
        <form id="welcome-form">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" placeholder="이름을 입력해주세요" autocomplete="given-name" maxlength="40" required />
          <button type="submit">인사 받기 <span aria-hidden="true">→</span></button>
        </form>
        <p class="note">입력한 이름은 저장하거나 전송하지 않아요.</p>
      </section>
    </main>
    <footer>오늘도 당신에게 좋은 일이 가득하길.</footer>
    <script>
      const form = document.querySelector('#welcome-form');
      const nameInput = document.querySelector('#name');
      const greeting = document.querySelector('#greeting');

      nameInput.addEventListener('input', () => nameInput.setCustomValidity(''));
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.setCustomValidity('이름을 입력해주세요.');
          nameInput.reportValidity();
          return;
        }
        nameInput.setCustomValidity('');
        greeting.textContent = `${name} 님 어서오세요`;
      });
    </script>
  </body>
</html>
